[package]
name = "rs-plugin-nh"
version = "0.19.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
rs-plugin-common-interfaces = "0.34.0"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = "0.11"

[dev-dependencies]
extism = "1"
